name: ${COMPOSE_PROJECT_NAME:-classification}

x-airflow: &airflow
  image: classification-airflow:local
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  profiles: [orchestration]
  user: "${LOCAL_UID:-1000}:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./runtime/airflow/state:/opt/airflow/state
    - ./runtime/airflow/logs:/opt/airflow/logs
    - ./runtime/airflow/auth:/opt/airflow/auth
    - ./src:/workspace/src:ro
    - ./configs:/workspace/configs:ro
    - ./data:/workspace/data
    - ./reports:/workspace/reports
  restart: unless-stopped

services:
  streamlit:
    image: classification-streamlit:local
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - ./streamlit_app:/workspace/streamlit_app:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  jupyter:
    image: classification-jupyter:local
    build:
      context: .
      dockerfile: docker/jupyter/Dockerfile
    profiles: [notebook]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8889}:8888"
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./src:/workspace/src
      - ./data:/workspace/data
      - ./reports:/workspace/reports
      - ./configs:/workspace/configs
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; r=urllib.request.Request('http://localhost:8888/api',headers={'Authorization':'token '+os.environ['JUPYTER_TOKEN']}); urllib.request.urlopen(r,timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  airflow:
    <<: *airflow
    command: [standalone]
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
